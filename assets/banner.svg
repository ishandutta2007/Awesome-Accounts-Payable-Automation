<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes nodePulse {
      0%, 100% { r: 6; fill-opacity: 0.9; }
      50% { r: 8; fill-opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    .flowing-path {
      stroke-dasharray: 8 8;
      animation: flowLine 4s linear infinite;
    }
    .floating-container {
      animation: floatCard 6s ease-in-out infinite;
    }
    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .node-dot {
      animation: nodePulse 3s ease-in-out infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="160" fill="url(#glowGrad)" class="pulsing-orb" />
  <circle cx="1000" cy="260" r="180" fill="url(#glowGrad)" class="pulsing-orb" style="animation-delay: -3.5s;" />

  <!-- Left/Center Branding Area -->
  <g transform="translate(80, 55)">
    <!-- Top Micro Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8" class="node-dot" />
    <text x="26" y="18" fill="#38bdf8" class="badge-text">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#primaryGrad)" class="title-text" font-size="40">Awesome Accounts Payable</text>
    <text x="0" y="122" fill="#ffffff" class="title-text" font-size="40">Automation (AP)</text>

    <!-- Subtitle -->
    <text x="0" y="160" fill="#94a3b8" class="subtitle-text" font-size="15">
      The ultimate guide to AI OCR, 3-Way Matching, Approval Workflows,
    </text>
    <text x="0" y="182" fill="#94a3b8" class="subtitle-text" font-size="15">
      Enterprise Spend Management, SaaS Leaders &amp; Open-Source Projects.
    </text>
  </g>

  <!-- Interactive/Dynamic Workflow Flow Diagram (Right Section) -->
  <g class="floating-container" transform="translate(680, 45)">
    <!-- Main AP Pipeline Box -->
    <rect x="0" y="0" width="440" height="260" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="440" height="38" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="52" cy="19" r="5" fill="#10b981" opacity="0.8"/>
    <text x="75" y="23" fill="#cbd5e1" class="badge-text" font-size="12">AP AUTOMATION WORKFLOW</text>

    <!-- Workflow Nodes -->
    <!-- Node 1: Ingestion & OCR -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="110" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="12" y="24" fill="#38bdf8" font-size="16">📄</text>
      <text x="36" y="24" fill="#f8fafc" class="badge-text" font-size="11">Invoice Capture</text>
      <text x="12" y="44" fill="#64748b" class="badge-text" font-size="9.5">AI OCR &amp; VLM</text>
      <text x="12" y="58" fill="#94a3b8" class="badge-text" font-size="9">Line Extraction</text>
    </g>

    <!-- Flow Line 1 -> 2 -->
    <path d="M 140 95 L 170 95" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flowing-path" />

    <!-- Node 2: 3-Way Match -->
    <g transform="translate(170, 60)">
      <rect x="0" y="0" width="110" height="70" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2"/>
      <text x="12" y="24" fill="#6366f1" font-size="16">⚡</text>
      <text x="36" y="24" fill="#f8fafc" class="badge-text" font-size="11">3-Way Match</text>
      <text x="12" y="44" fill="#64748b" class="badge-text" font-size="9.5">PO &amp; Receipt Sync</text>
      <text x="12" y="58" fill="#94a3b8" class="badge-text" font-size="9">GL Auto-Coding</text>
    </g>

    <!-- Flow Line 2 -> 3 -->
    <path d="M 280 95 L 310 95" fill="none" stroke="#818cf8" stroke-width="2.5" class="flowing-path" />

    <!-- Node 3: Approvals -->
    <g transform="translate(310, 60)">
      <rect x="0" y="0" width="100" height="70" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="12" y="24" fill="#a855f7" font-size="16">✅</text>
      <text x="36" y="24" fill="#f8fafc" class="badge-text" font-size="11">Approvals</text>
      <text x="12" y="44" fill="#64748b" class="badge-text" font-size="9.5">Hierarchy Rules</text>
      <text x="12" y="58" fill="#94a3b8" class="badge-text" font-size="9">Audit Logging</text>
    </g>

    <!-- Flow Line 2 down to ERP / Payment -->
    <path d="M 225 130 L 225 155" fill="none" stroke="#6366f1" stroke-width="2.5" class="flowing-path" />

    <!-- Bottom Node: Global Payment & ERP Posting -->
    <g transform="translate(70, 160)">
      <rect x="0" y="0" width="300" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="20" y="28" fill="#10b981" font-size="18">💳</text>
      <text x="50" y="28" fill="#f8fafc" class="badge-text" font-size="12">Payment Execution &amp; ERP Sync</text>
      <text x="50" y="46" fill="#94a3b8" class="badge-text" font-size="10">ACH · Wire · Virtual Cards · International Multi-Currency</text>
      <text x="50" y="62" fill="#64748b" class="badge-text" font-size="9.5">NetSuite · SAP · QuickBooks · Xero · ERPNext · Odoo</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#primaryGrad)" />
</svg>
